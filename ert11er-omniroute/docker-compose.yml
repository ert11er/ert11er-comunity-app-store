version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: ert11er-omniroute_omniroute_1
      APP_PORT: 20128
      # OmniRoute has its own dashboard password and API keys, and its
      # OpenAI-compatible /v1 endpoint has to stay reachable for non-browser
      # clients that cannot send Umbrel auth cookies.
      PROXY_AUTH_ADD: "false"

  omniroute:
    # Web image: same gateway plus Chromium/Playwright, needed for the
    # browser-session providers (Gemini Web, Claude Web, and similar).
    image: diegosouzapw/omniroute:3.8.53-web@sha256:3e0c119abc8e280f99bd3f3db9a37913caf07e397b465caa1f56bf4feb271e63
    restart: on-failure
    init: true
    stop_grace_period: 40s
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      # Umbrel shows this per-install password on the app page, so the
      # dashboard is protected from the first boot.
      - INITIAL_PASSWORD=${APP_PASSWORD}
      # Use the Umbrel-injected container name so the app never resolves
      # another app's "redis" service on the shared Docker network.
      - REDIS_URL=redis://:${APP_SEED}@ert11er-omniroute_redis_1:6379
      # V8 heap ceiling in MB. Raise it if you run heavy coding-agent sessions
      # and your Umbrel has RAM to spare (see the app description).
      - OMNIROUTE_MEMORY_MB=2048
      # The app is reachable through the Umbrel app proxy, so require an API key
      # instead of exposing an anonymous AI proxy to the local network.
      - REQUIRE_API_KEY=true
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  redis:
    image: redis:8.6.5-alpine@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
    restart: on-failure
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${APP_SEED}"]
    environment:
      # redis-cli reads this for the healthcheck without putting the password
      # in the healthcheck command itself.
      - REDISCLI_AUTH=${APP_SEED}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
